<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            width: 500px;
            margin: 80px auto;
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        h2 {
            color: #444;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .result {
            padding: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #2196F3;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        a:hover {
            background: #0b7dda;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Prediction Result</h2>
    <div class="result">
        {{ prediction_text }}
    </div>
    <a href="/">Back to Form</a>
</div>
</body>
</html>
